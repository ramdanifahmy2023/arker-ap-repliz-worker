name: Verify application

on:
  push:
    branches: [main, 'work/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    name: Application / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.lock -e .
      - name: Install web dependencies
        run: npm ci --prefix apps/web
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: command -v ffmpeg || brew install ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
          }
      - name: Verify source, API, worker, lifecycle, web and actual media
        run: python scripts/verify.py --media
      - name: Build portable wheel with web application
        run: python scripts/package.py
      - name: Install browser for isolated acceptance
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Verify browser, accessibility and live local worker controls
        if: runner.os == 'Linux'
        run: python scripts/test_browser_ci.py
      - name: Upload synthetic checks and wheel
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: arker-${{ runner.os }}
          path: |
            .artifacts/backend-tests.xml
            .artifacts/media-*/evidence.json
            .artifacts/browser-ci-review/report.json
            .artifacts/browser-ci-review/lifecycle-report.json
            dist/*.whl
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
